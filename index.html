<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AXIS معرض علي اكرم</title>
<meta name="description" content="معرض علي اكرم للالكترونيات AXIS - الخالص. تنزيل ألعاب PS4 وبيع جميع الأجهزة. اختر ألعابك وأرسل الطلب على واتساب.">
<meta property="og:title" content="AXIS معرض علي اكرم للالكترونيات">
<meta property="og:description" content="اختر ألعاب PS4 وأرسل الطلب على واتساب">
<meta property="og:image" content="logo.jpg">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#070a14">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AXIS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Changa:wght@500;700;800&family=Readex+Pro:wght@300;400;500;600&display=swap">
<style>
/* Layout: neon shop hero (logo + identity + contact) → sticky search bar → cover grid → contact footer; floating WhatsApp basket. Single dark neon look matching the AXIS sign. */
:root{
  color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#070a14; --surface:#0e1324; --surface-2:#161d34; --fg:#eef1fb; --muted:#8f9bbd; --line:#232c47;
  --cyan:#35d6ff; --pink:#ff3d73; --accent:#35d6ff; --accent-fg:#04121a; --wa:#22c065; --danger:#ff6b7a;
  --f-display:"Changa","Readex Pro",system-ui,sans-serif;
  --f-body:"Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}img{max-width:100%}[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--cyan)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:
  radial-gradient(600px 300px at 85% 10%, rgb(255 61 115 / .18), transparent 70%),
  radial-gradient(700px 360px at 10% 90%, rgb(53 214 255 / .16), transparent 70%), var(--bg)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(180deg,transparent,#000 40%,transparent)}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:36px;align-items:center;padding-block:36px 40px}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr;gap:22px;padding-block:22px 28px}}
.logo-frame{border-radius:28px;padding:3px;background:linear-gradient(135deg,var(--cyan),var(--pink));box-shadow:0 0 40px rgb(53 214 255 / .25),0 0 60px rgb(255 61 115 / .18);max-width:460px;width:100%;justify-self:center}
.logo-frame img{display:block;width:100%;border-radius:25px;aspect-ratio:1;object-fit:cover}
.eyebrow{font-size:13px;letter-spacing:.04em;color:var(--muted)}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,48px);line-height:1.15;margin:6px 0 0;text-wrap:balance}
.axis{font-family:var(--f-display);font-weight:800;font-size:clamp(46px,9vw,92px);line-height:1;letter-spacing:.06em;direction:ltr;text-align:right;background:linear-gradient(90deg,var(--pink),#c56bff 45%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0 10px;filter:drop-shadow(0 0 18px rgb(53 214 255 / .25))}
.addr{display:flex;gap:8px;align-items:flex-start;color:var(--fg);font-size:16px}
.addr svg{flex-shrink:0;margin-top:4px}
.svc{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
.svc span{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;direction:ltr}
.svc-l{font-size:13px;color:var(--muted);margin-top:14px}
.dl{margin-top:14px;font-weight:600;font-size:17px;color:var(--cyan)}
.mgr{color:var(--muted);font-size:14px;margin-top:2px}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-items:center}
.phone{font-family:var(--f-display);font-weight:700;font-size:22px;direction:ltr;letter-spacing:.04em;user-select:all}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.stats b{display:block;font-family:var(--f-display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:12.5px;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--cyan)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff;font-weight:600}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 12px;font-size:13.5px}
.btn:disabled{opacity:.55;cursor:default}

/* sticky bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgb(7 10 20 / .92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-block:10px}
.bar .mini-logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;letter-spacing:.06em;direction:ltr}
.bar .mini-logo img{width:34px;height:34px;border-radius:9px;object-fit:cover}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px}
.bar select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 10px;max-width:100%}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface)}
.owner{display:flex;gap:8px}
@media (max-width:600px){.bar .mini-logo span{display:none}.bar .wrap{gap:8px}.bar select,.toggle{flex:1 1 30%;font-size:13px;padding:8px}.basket .wrap{gap:8px}.basket .sum strong{font-size:15px}}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:26px 12px}
.sec-h h2{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3.4vw,32px);margin:0}
.sec-h p{margin:0;color:var(--muted);font-size:13.5px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:16px;padding-bottom:40px}
@media (max-width:440px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;position:relative;transition:border-color .15s, box-shadow .15s, transform .15s}
.card:hover{transform:translateY(-2px)}
.card.sel{border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan),0 0 22px rgb(53 214 255 / .3)}
.cover{aspect-ratio:4/5;max-width:100%;background:var(--surface-2);position:relative;display:block;width:100%;border:0;padding:0}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12px;font-family:var(--f-display);font-size:20px;line-height:1.2;color:var(--muted);background:linear-gradient(160deg,var(--surface-2),var(--bg))}
.tick{position:absolute;top:8px;inset-inline-start:8px;width:32px;height:32px;border-radius:50%;background:rgb(7 10 20 / .75);border:2px solid rgb(255 255 255 / .7);display:grid;place-items:center;font-weight:700;color:transparent}
.card.sel .tick{background:var(--cyan);border-color:var(--cyan);color:var(--accent-fg)}
.badge{position:absolute;bottom:8px;inset-inline-start:8px;inset-inline-end:8px;width:max-content;max-width:calc(100% - 16px);background:rgb(7 10 20 / .85);color:var(--fg);border-radius:7px;font-size:11px;padding:2px 8px;border:1px solid var(--pink)}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.info h3{margin:0;font-size:14.5px;font-weight:600;line-height:1.35;overflow-wrap:anywhere;direction:ltr;text-align:right}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:12.5px;color:var(--muted)}
.meta b{font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;border-radius:999px;padding:1px 8px;background:var(--surface-2);color:var(--fg)}
.chip.ar{background:rgb(34 192 101 / .16);color:#7ce3a6}
.more{margin-top:auto;font-size:12.5px;background:none;border:0;color:var(--cyan);padding:0;text-align:start}

.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 16px;border:1px dashed var(--line);border-radius:var(--r)}

footer{border-top:1px solid var(--line);background:var(--surface);padding-bottom:120px}
footer .wrap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:24px;align-items:center;padding-block:26px}
@media (max-width:720px){footer .wrap{grid-template-columns:1fr}}
footer img.f-logo{width:96px;height:96px;border-radius:18px;object-fit:cover}
footer h3{margin:0;font-family:var(--f-display);font-size:20px}
footer p{margin:2px 0;color:var(--muted)}
.soc{display:flex;gap:8px;flex-wrap:wrap}

.basket{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--cyan);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 30px rgb(0 0 0 / .5)}
.basket .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.basket .sum{flex:1;min-width:0}
.basket .sum strong{font-size:16px}
.basket .sum div{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}


/* install bar */
.inst{background:linear-gradient(90deg,rgb(255 61 115 / .22),rgb(53 214 255 / .2));border-bottom:1px solid var(--line)}
.inst .wrap{display:flex;align-items:center;gap:12px;padding-block:9px;flex-wrap:wrap}
.inst img{width:38px;height:38px;border-radius:10px;object-fit:cover;flex-shrink:0}
.inst .t{flex:1;min-width:0;font-size:14px;line-height:1.4}
.inst .t b{display:block;font-size:14.5px}
.inst .t span{color:var(--muted);font-size:12.5px}
.inst .x{background:none;border:0;color:var(--muted);font-size:20px;padding:4px 8px;line-height:1}
.steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.steps b{color:var(--cyan)}
/* new arrivals */
.new-sec{padding-top:6px}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,170px);gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.strip .card{scroll-snap-align:start}
.newb{position:absolute;top:8px;inset-inline-end:8px;background:var(--pink);color:#fff;font-weight:600;font-size:11px;border-radius:6px;padding:1px 8px;box-shadow:0 0 12px rgb(255 61 115 / .6)}
.yt-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:#e0002a;color:#fff;border-radius:12px;padding:12px 16px;text-decoration:none;font-weight:600;text-align:center}
.yt-btn:hover{background:#ff1744}
.yt-btn small{display:block;font-weight:400;opacity:.85;font-size:12px}
.acts{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px}
.acts .more{margin-top:0}
.yt-s{font-size:12px;color:#ff8095;text-decoration:none;white-space:nowrap}
.chip.vid{background:rgb(255 0 51 / .18);color:#ff8095}

/* platform chooser */
.chooser{padding-block:22px 26px;border-bottom:1px solid var(--line);background:radial-gradient(500px 260px at 80% 0%,rgb(255 61 115 / .16),transparent 70%),radial-gradient(520px 280px at 15% 100%,rgb(53 214 255 / .14),transparent 70%)}
.ch-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ch-head img{width:52px;height:52px;border-radius:13px;object-fit:cover}
.ch-head b{display:block;font-family:var(--f-display);font-size:clamp(20px,3.6vw,28px);line-height:1.2}
.ch-head span{color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:640px){.tiles{grid-template-columns:1fr;gap:12px}}
.tile{--c:var(--cyan);position:relative;display:flex;align-items:center;gap:16px;width:100%;text-align:start;border:2px solid var(--c);border-radius:20px;padding:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 18%,var(--surface)),var(--surface) 70%);color:var(--fg);text-decoration:none;box-shadow:0 0 26px color-mix(in srgb,var(--c) 30%,transparent);transition:transform .15s,box-shadow .15s;min-height:150px;overflow:hidden}
.tile:hover{transform:translateY(-3px);box-shadow:0 0 38px color-mix(in srgb,var(--c) 45%,transparent)}
.tile.ps3{--c:var(--pink)}
.t-covers{position:relative;width:118px;height:122px;flex-shrink:0}
.t-covers img{position:absolute;width:72px;height:90px;object-fit:cover;border-radius:8px;border:2px solid rgb(255 255 255 / .85);box-shadow:0 6px 16px rgb(0 0 0 / .5);background:var(--surface-2)}
.t-covers img:nth-child(1){right:0;top:22px;transform:rotate(8deg)}
.t-covers img:nth-child(2){right:24px;top:10px;transform:rotate(-2deg);z-index:1}
.t-covers img:nth-child(3){right:46px;top:26px;transform:rotate(-10deg)}
.t-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.t-tag{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,6vw,46px);line-height:1;direction:ltr;text-align:right;color:var(--c);text-shadow:0 0 18px color-mix(in srgb,var(--c) 60%,transparent)}
.t-txt b{font-size:clamp(17px,2.6vw,20px)}
.t-txt span.n{color:var(--muted);font-size:13.5px}
.t-go{align-self:flex-end;background:var(--c);color:#04121a;font-weight:700;border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg a{padding:8px 14px;text-decoration:none;color:var(--muted);font-family:var(--f-display);font-weight:700;direction:ltr}
.seg a.on{background:var(--cyan);color:#04121a}
.seg a.on.p3{background:var(--pink);color:#fff}
a.mini-logo{text-decoration:none;color:var(--fg)}

/* v3: prices, categories, storage meter, favourites, platforms */
.tile.ps5{--c:#dfe6ff}.tile.ps2{--c:#9b7bff}.tile.xbox{--c:#3fdc6b}
.seg a.on.ps3{background:var(--pink);color:#fff}.seg a.on.ps5{background:#dfe6ff;color:#04121a}.seg a.on.ps2{background:#9b7bff;color:#fff}.seg a.on.xbox{background:#3fdc6b;color:#04121a}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.mini-tile{--c:var(--cyan);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:2px solid var(--c);border-radius:16px;padding:12px 8px;text-decoration:none;color:var(--fg);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 14%,var(--surface)),var(--surface) 75%);min-height:84px;text-align:center}
.mini-tile .t-tag{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;color:var(--c);direction:ltr}
.mini-tile .n{font-size:12.5px;color:var(--muted)}
.mini-tile.ps5{--c:#dfe6ff}.mini-tile.ps2{--c:#9b7bff}.mini-tile.xbox{--c:#3fdc6b}.mini-tile.ps3{--c:var(--pink)}
.mini-tile.soon{--c:#4a5578;filter:grayscale(1);opacity:.55;cursor:not-allowed;border-style:dashed}
.mini-tile.soon .n{font-weight:600}
.price{font-family:var(--f-display);font-weight:700;font-size:15px;color:#7ce3a6}
.chip.hotc{background:rgb(255 140 0 / .18);color:#ffb35c}
.heart{background:none;border:0;padding:2px 4px;font-size:16px;line-height:1;cursor:pointer}
.bar .wrap.cats{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;padding-block:0 10px;scrollbar-width:none}
.bar .wrap.cats::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap}
.cat small{color:var(--muted);font-size:11.5px}
.cat.on{background:var(--cyan);border-color:var(--cyan);color:#04121a;font-weight:600}
.cat.on small{color:#04121a}
.since{background:rgb(255 179 92 / .14);border-bottom:1px solid rgb(255 179 92 / .35)}
.since .wrap{display:flex;align-items:center;gap:12px;padding-block:9px}
.since .bell{font-size:22px}
.since .t{flex:1;min-width:0;line-height:1.4}
.since .t b{display:block;font-size:14.5px}
.since .t span{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}
.since .x{background:none;border:0;color:var(--muted);font-size:20px;padding:4px 8px}
.basket .wrap{flex-direction:column;align-items:stretch;gap:8px}
.b-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.b-row .sum{flex:1;min-width:0}
.basket .tot{color:#7ce3a6}
.meter{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg)}
.m-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.m-p{font-family:var(--f-display);font-weight:800;color:var(--fg);direction:ltr}
.m-opts{display:inline-flex;gap:6px}
.m-opt{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:3px 10px;font-size:13px;direction:ltr}
.m-opt.on{background:var(--cyan);border-color:var(--cyan);color:#04121a;font-weight:600}
.m-bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:7px 0 4px}
.m-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),#7ce3a6);border-radius:99px;transition:width .3s}
.meter.over .m-bar i{background:var(--danger)}
.meter.over .m-txt{color:var(--danger);font-weight:600}
.m-txt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.req{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px dashed var(--line);border-radius:var(--r);padding:14px;margin-bottom:40px;background:var(--surface)}
.req>div{flex:1 1 200px;min-width:0}
.req b{display:block;font-size:16px}
.req span{color:var(--muted);font-size:13px}
.req input{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px}
.sim b{display:block;margin-bottom:8px}
.sim-row{display:grid;grid-auto-flow:column;grid-auto-columns:96px;gap:10px;overflow-x:auto;padding-bottom:6px}
.sim-i{display:flex;flex-direction:column;gap:4px;background:none;border:0;padding:0;color:var(--fg);text-align:start;cursor:pointer;position:relative}
.sim-i img,.sim-i .ph{width:96px;height:120px;object-fit:cover;border-radius:8px;background:var(--surface-2);position:relative}
.sim-i span{font-size:11.5px;line-height:1.3;direction:ltr;text-align:right;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grid{padding-bottom:20px}
footer{padding-bottom:220px}
/* dialogs */
.veil{position:fixed;inset:0;z-index:20;background:rgb(2 4 10 / .7);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:100%;max-width:640px;padding:20px;display:flex;flex-direction:column;gap:14px;margin-block:auto}

function selByPlat(){
  var m={}; sel.forEach(function(id){ var g=byId(id); if(!g) return; var k=pf(g); (m[k]=m[k]||[]).push(g); }); return m;
}
function driveFor(k){ var d=DRIVES[k]||DRIVES.ps4, i=Number(drive[k]); if(!(i>=0&&i<d.length)) i=0; return {i:i,label:d[i][0],usable:d[i][1],list:d}; }
function usage(k,games){ var d=driveFor(k), used=games.reduce(function(s,g){ return s+(Number(g.sizeGB)||0); },0); return {d:d,used:used,over:used>d.usable,pct:Math.min(100,Math.round(used/d.usable*100))}; }
function totals(){ var m=selByPlat(), n=0, tot=0, size=0, over=false; Object.keys(m).forEach(function(k){ m[k].forEach(function(g){ n++; tot+=priceOf(g); size+=Number(g.sizeGB)||0; }); if(usage(k,m[k]).over) over=true; }); return {m:m,n:n,tot:tot,size:size,over:over}; }
function basketHTML(){
  var t=totals(); if(!t.n) return "";
  var k=plat&&t.m[plat]?plat:Object.keys(t.m)[0], u=usage(k,t.m[k]);
  return '<div class="basket'+(t.over?' over':'')+'"><div class="b-prog"><i style="width:'+u.pct+'%"></i></div><div class="wrap"><div class="b-sum"><b>'+plural(t.n)+' · <span class="tot">'+fmtIQD(t.tot)+'</span></b><span>'+(t.over?'⚠ أكبر من مساحة جهازك':fmtSize(t.size)+' من '+fmtSize(u.d.usable)+' · جهاز \u2066'+u.d.label+'\u2069')+'</span></div><button class="btn wa" id="b-send">مراجعة الطلب ←</button></div></div>';
}

// ---------- render ----------
var lastVisitShown=lastVisit;
function render(){
  cleanSel();
  var h=noticeHTML();
  if(!plat){
    h+=brandHTML()+chooserHTML()+howHTML()+shopHTML()+basketHTML();
    app.innerHTML=h; wire(); return;
  }
  var all=pool(), fn=catFn(cat), searching=!!q.trim();
  var list=cat==="since" ? all.filter(function(g){ return g.addedAt&&g.addedAt>lastVisitShown && matches(g,q); }) : all.filter(function(g){ return fn(g) && matches(g,q); });
  list.sort(function(a,b){
    if(sortBy==="shop") return (b.hot?1:0)-(a.hot?1:0) || S.games.indexOf(a)-S.games.indexOf(b);
    if(sortBy==="added") return String(b.addedAt||"").localeCompare(String(a.addedAt||"")) || S.games.indexOf(a)-S.games.indexOf(b);
    if(sortBy==="release") return String(b.releaseDate||"").localeCompare(String(a.releaseDate||""));
    if(sortBy==="size") return (Number(a.sizeGB)||0)-(Number(b.sizeGB)||0);
    if(sortBy==="name") return String(a.name).localeCompare(String(b.name));
    return 0;
  });
  h+='<div class="bar"><div class="wrap">';
  h+='<a class="home" href="#" aria-label="الرئيسية">'+(S.settings.logo?'<img src="'+esc(S.settings.logo)+'" alt="">':'⌂')+'</a>';
  h+='<div class="seg" role="tablist">'+PLATS.filter(active).map(function(k){ return '<a href="#'+k+'" class="'+(plat===k?'on '+k:'')+'">'+PL[k]+'</a>'; }).join("")+'</div>';
  h+='<div class="srch"><input class="search" id="q" type="search" placeholder="ابحث… جاتا، فيفا، كول اوف" value="'+esc(q)+'" aria-label="بحث"></div>';
  h+='</div></div>';
  h+='<div class="wrap cats" role="toolbar" aria-label="الأقسام">';
  CATS.forEach(function(c){
    if(c[0]!=="all"&&c[0]!=="fav"&&!all.some(c[2])) return;
    h+='<button class="cat'+(cat===c[0]?' on':'')+'" data-cat="'+c[0]+'">'+c[1]+'</button>';
  });
  if(cat==="since") h+='<button class="cat on" data-cat="since">🔔 من آخر زيارة</button>';
  h+='</div>';
  h+='<main class="wrap">';
  var ng=all.filter(isNew).sort(function(a,b){ return String(b.addedAt).localeCompare(String(a.addedAt)); }).slice(0,12);
  if(ng.length && !searching && cat==="all") h+='<section class="new-sec"><h2 class="sec">وصلت حديثاً</h2><div class="strip">'+ng.map(cardHTML).join("")+'</div></section>';
  var title=searching?'نتائج البحث':(cat==="all"?'كل ألعاب '+PL[plat]:(cat==="since"?'الجديد من آخر زيارتك':CATS.filter(function(c){return c[0]===cat;})[0][1]));
  h+='<div class="sec-row"><h2 class="sec">'+esc(title)+' <small>'+list.length+'</small></h2><label class="sort"><span class="sr-only">الترتيب</span><select id="sort">'+[["shop","ترتيب المحل"],["added","الأحدث إضافة"],["release","الأحدث إصداراً"],["size","الأصغر حجماً"],["name","حسب الاسم"]].map(function(o){return '<option value="'+o[0]+'"'+(o[0]===sortBy?' selected':'')+'>'+o[1]+'</option>';}).join("")+'</select></label></div>';
  h+='<div class="grid">';
  if(!all.length) h+='<div class="empty">لا توجد ألعاب بعد.</div>';
  else if(!list.length) h+='<div class="empty">'+(cat==="fav"?'ما عندك مفضلة بعد. افتح أي لعبة ودوس 🤍.':'ما لكينا هذي اللعبة.')+'</div>';
  list.forEach(function(g){ h+=cardHTML(g); });
  h+='</div>'+requestHTML(list.length?"":q)+'</main>';
  h+=shopHTML()+basketHTML();
  app.innerHTML=h;
  wire();
}

function wire(){
  var qi=document.getElementById("q");
  if(qi) qi.addEventListener("input",function(){ q=qi.value; var pos=qi.selectionStart, y=window.scrollY; render(); window.scrollTo(0,y); var n=document.getElementById("q"); n.focus({preventScroll:true}); try{n.setSelectionRange(pos,pos);}catch(e){} });
  var so=document.getElementById("sort"); if(so) so.onchange=function(e){ sortBy=e.target.value; keep(render); };
  app.querySelectorAll("[data-cat]").forEach(function(b){ b.onclick=function(){ cat=b.getAttribute("data-cat"); keep(render); }; });
  app.querySelectorAll("[data-tog]").forEach(function(b){ b.onclick=function(){ var id=b.getAttribute("data-tog"); if(sel.has(id)) sel.delete(id); else sel.add(id); saveSel(); keep(render); }; });
  app.querySelectorAll("[data-det]").forEach(function(b){ b.onclick=function(){ showDetail(b.getAttribute("data-det")); }; });
  var s=document.getElementById("b-send"); if(s) s.onclick=showSend;
  var ib=document.getElementById("b-inst"); if(ib) ib.onclick=doInstall;
  var ix=document.getElementById("b-instx"); if(ix) ix.onclick=function(){ lsSet("axisinst","1"); keep(render); };
  var sb=document.getElementById("b-since"); if(sb) sb.onclick=function(){ var ng=sinceGames(); sinceDismiss=true; plat=pf(ng[0]); prevPlat=plat; cat="since"; q=""; history.replaceState(null,"","#"+plat); render(); window.scrollTo(0,0); };
  var sx=document.getElementById("b-sincex"); if(sx) sx.onclick=function(){ sinceDismiss=true; keep(render); };
  var rb=document.getElementById("b-req"); if(rb) rb.onclick=function(){
    var v=document.getElementById("req-q").value.trim(); if(!v){ document.getElementById("req-q").focus(); return; }
    window.open(waLink("السلام عليكم "+(S.settings.brand||"")+"، أريد لعبة: "+v+" لجهاز "+PL[plat]+". متوفرة عندكم؟"),"_blank","noopener");
  };
}

// ---------- dialogs ----------
function openSheet(html,cls){
  closeSheet(true);
  var v=document.createElement("div"); v.className="veil"; v.id="veil";
  v.innerHTML='<div class="sheet'+(cls?' '+cls:'')+'" role="dialog" aria-modal="true">'+html+'</div>';
  v.addEventListener("click",function(e){ if(e.target===v) closeSheet(); });
  document.body.appendChild(v); document.body.classList.add("noscroll");
  v.querySelectorAll("[data-close]").forEach(function(b){ b.onclick=function(){ closeSheet(); }; });
  document.addEventListener("keydown",escClose);
  return v;
}
function escClose(e){ if(e.key==="Escape") closeSheet(); }
function closeSheet(silent){
  var v=document.getElementById("veil"); if(v) v.remove(); document.body.classList.remove("noscroll"); document.removeEventListener("keydown",escClose);
  if(!silent && /^#game-/.test(location.hash)) history.replaceState(null,"",plat?"#"+plat:location.pathname);
}
function similar(g){
  var tg=String(g.genre||"").split(/[،,]/).map(function(x){return x.trim();}).filter(Boolean);
  return S.games.filter(function(o){ return o.id!==g.id && pf(o)===pf(g); }).map(function(o){
    var og=String(o.genre||""), sc=0; tg.forEach(function(t,i){ if(og.indexOf(t)>=0) sc+= i===0?3:1; });
    if(o.developer && o.developer===g.developer) sc+=1;
    return [sc,o];
  }).filter(function(x){ return x[0]>=3; }).sort(function(a,b){ return b[0]-a[0] || S.games.indexOf(a[1])-S.games.indexOf(b[1]); }).slice(0,8).map(function(x){ return x[1]; });
}
function showDetail(id){
  var g=byId(id); if(!g) return;
  history.replaceState(null,"","#game-"+id);
  var rows=[["النوع",g.genre],["تاريخ الإصدار",fmtDate(g.releaseDate)],["المطوّر",g.developer],["عدد اللاعبين",g.players],["التصنيف العمري",g.rating],["اللغة العربية",g.arabic?"مدعومة ✓":"غير مدعومة"]];
  if(g.note) rows.unshift(["ملاحظة",g.note]);
  var on=sel.has(id), fv=fav.has(id), sim=similar(g);
  var v=openSheet('<button class="sh-x" data-close aria-label="إغلاق">×</button>'+

    '<button class="btn '+(on?'':'primary')+' d-main" id="d-tog">'+(on?'✓ مضافة لطلبك · إزالة':'＋ أضف إلى طلبي')+'</button>'+
    '<div class="d-acts"><button class="d-a" id="d-fav">'+(fv?'❤️':'🤍')+'<span>'+(fv?'بالمفضلة':'المفضلة')+'</span></button><button class="d-a" id="d-share">'+SHARE+'<span>مشاركة</span></button><a class="d-a yt" href="'+ytSearch(g)+'" target="_blank" rel="noopener">'+YT+'<span>تختيم بالعربي</span></a></div>'+
    (g.desc?'<p class="d-desc">'+esc(g.desc)+'</p>':'')+
    '<div class="d-spec">'+rows.map(function(r){return '<span>'+r[0]+'</span><b>'+esc(r[1]||"—")+'</b>';}).join("")+'</div>'+
    (sim.length?'<div class="sim"><b>ألعاب مشابهة</b><div class="sim-row">'+sim.map(function(o){ return '<button class="sim-i" data-sim="'+esc(o.id)+'">'+(o.cover?'<img src="'+esc(o.cover)+'" alt="" loading="lazy">':'<span class="ph" style="font-size:12px">'+esc(o.name)+'</span>')+'<span>'+esc(o.name)+'</span></button>'; }).join("")+'</div></div>':''),"game");
  v.querySelector("#d-tog").onclick=function(){ if(sel.has(id)) sel.delete(id); else sel.add(id); saveSel(); closeSheet(); keep(render); };
  v.querySelector("#d-fav").onclick=function(){ if(fav.has(id)) fav.delete(id); else fav.add(id); saveFav(); keep(render); showDetail(id); };
  v.querySelector("#d-share").onclick=function(){
    var url=gameUrl(g), text="شوف لعبة "+g.name+" ("+PL[pf(g)]+") بمتجر "+(S.settings.brand||"AXIS")+" ب "+Number(priceOf(g)).toLocaleString("en-US")+" دينار:";
    if(navigator.share){ navigator.share({title:g.name,text:text,url:url}).catch(function(){}); return; }
    window.open("https://wa.me/?text="+encodeURIComponent(text+"\n"+url),"_blank","noopener");
  };
  v.querySelectorAll("[data-sim]").forEach(function(b){ b.onclick=function(){ showDetail(b.getAttribute("data-sim")); }; });
}

function orderText(name){
  var m=selByPlat(), lines=[], i=0, tot=0, size=0;
  PLATS.forEach(function(k){
    if(!m[k]) return;
    var d=driveFor(k);
    lines.push("🎮 "+PLF[k]+" (مساحة الجهاز: "+d.label+"):");
    m[k].forEach(function(g){ i++; tot+=priceOf(g); size+=Number(g.sizeGB)||0; lines.push(i+"- "+g.name+(g.sizeGB?" ("+(Math.round(g.sizeGB*10)/10)+" GB)":"")+" — "+Number(priceOf(g)).toLocaleString("en-US")+" د.ع"); });
    lines.push("");
  });
  return "السلام عليكم "+(S.settings.brand||"")+"، أريد تنزيل هذه الألعاب:\n\n"+lines.join("\n")+"عدد الألعاب: "+i+"\nالحجم الكلي تقريباً: "+(Math.round(size*10)/10)+" GB\nالمجموع: "+Number(tot).toLocaleString("en-US")+" دينار"+(name?"\nالاسم: "+name:"");
}
function showSend(){
  var num=waNum(), t=totals();
  if(!t.n){ closeSheet(); return; }
  var h='<button class="sh-x" data-close aria-label="إغلاق">×</button><h2 class="o-h">طلبك</h2>';
  PLATS.forEach(function(k){
    if(!t.m[k]) return;
    var u=usage(k,t.m[k]);
    h+='<div class="o-grp"><div class="o-gh"><b>'+PLF[k]+'</b><span class="o-dr">مساحة الجهاز '+u.d.list.map(function(o,i){ return '<button class="m-opt'+(i===u.d.i?' on':'')+'" data-drive="'+k+':'+i+'">'+o[0]+'</button>'; }).join("")+'</span></div>'+
      '<div class="meter'+(u.over?' over':'')+'"><div class="m-bar"><i style="width:'+u.pct+'%"></i></div><div class="m-txt">'+(u.over?'⚠ أكبر من مساحة جهازك: '+fmtSize(u.used)+' من '+fmtSize(u.d.usable)+' متاحة. شيل بعض الألعاب.':fmtSize(u.used)+' من '+fmtSize(u.d.usable)+' متاحة · يبقى '+fmtSize(u.d.usable-u.used))+'</div></div>'+
      '<ul class="o-list">'+t.m[k].map(function(g){ return '<li>'+(g.cover?'<img src="'+esc(g.cover)+'" alt="">':'<span class="o-ph"></span>')+'<span class="o-n">'+esc(g.name)+'<small>'+fmtSize(g.sizeGB)+'</small></span><span class="o-p">'+fmtIQD(priceOf(g))+'</span><button class="o-rm" data-rm="'+esc(g.id)+'" aria-label="إزالة '+esc(g.name)+'">×</button></li>'; }).join("")+'</ul></div>';
  });
  h+='<div class="o-tot"><span>'+plural(t.n)+' · '+fmtSize(t.size)+'</span><b>'+fmtIQD(t.tot)+'</b></div>'+
    '<div class="field"><label for="c-name">اسمك (اختياري)</label><input id="c-name" autocomplete="name"></div>'+
    (num?'<a class="btn wa d-main" id="c-go" target="_blank" rel="noopener">'+WA+' إرسال الطلب على واتساب</a>':'<div class="status err">رقم الواتساب غير مضاف بعد.</div>')+
    '<div class="o-foot"><button class="lnk" id="c-copy">نسخ نص الطلب</button><button class="lnk danger" id="c-clear">مسح كل الطلب</button></div><div class="status" id="c-st"></div>';
  var v=openSheet(h,"order");
  var ni=v.querySelector("#c-name"), go=v.querySelector("#c-go");
  ni.value=ls("axisname2","")||"";
  function upd(){ if(go) go.href=waLink(orderText(ni.value.trim())); lsSet("axisname2",ni.value); }
  ni.oninput=upd; upd();
  v.querySelectorAll("[data-drive]").forEach(function(b){ b.onclick=function(){ var p=b.getAttribute("data-drive").split(":"); drive[p[0]]=Number(p[1]); lsSet("axisdrive",drive); keep(render); var y=v.querySelector(".sheet").scrollTop; showSend(); var s2=document.querySelector("#veil .sheet"); if(s2) s2.scrollTop=y; }; });
  v.querySelectorAll("[data-rm]").forEach(function(b){ b.onclick=function(){ sel.delete(b.getAttribute("data-rm")); saveSel(); keep(render); showSend(); }; });
  v.querySelector("#c-clear").onclick=function(){ var b=this; if(b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent="متأكد؟ دوس مرة ثانية"; return; } sel.clear(); saveSel(); closeSheet(); keep(render); };
  v.querySelector("#c-copy").onclick=function(){
    var st=v.querySelector("#c-st"), txt=orderText(ni.value.trim());
    navigator.clipboard.writeText(txt).then(function(){ st.textContent="تم نسخ الطلب."; },function(){ st.textContent="ما كدرنا ننسخ. استخدم زر الواتساب."; });
  };
}

// ---------- routing ----------
var prevPlat="";
function route(){
  var h=(location.hash||"").toLowerCase(), m=h.match(/^#game-(.+)$/);
  if(m){ var g=byId(decodeURIComponent(location.hash.slice(6))); if(g){ plat=pf(g); render(); showDetail(g.id); return; } }
  var p=h.replace("#","");
  plat = PLATS.indexOf(p)>=0 && active(p) ? p : "";
  if(cat==="since"||plat!==prevPlat) cat="all";
  prevPlat=plat;
  closeSheet(true); q=""; render(); window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
})();
</script>
